seed: [1234, 2026, 2027]
models:
  - GSAI-ML/LLaDA-8B-Base
# Add iLLaDA-8B-Base only after verifying its upstream sampler/config in the target environment.
real_world:
  datasets: [wikitext2, ag_news, cnn_dailymail, xsum, multi_news]
  steps: [8, 16, 32, 64, 128]
  max_new_tokens: [128, 256]
  samples_per_dataset: 50
  methods: [confidence, entropy, attention, synapse_cut]
synthetic:
  families: [chain, star, tree, grid, random_dag, clustered_dag, long_range_dag]
  n_committed: [8, 12, 16, 20, 32, 48, 64]
  n_masked: [16, 32, 64, 128, 256]
  corruption: [0.05, 0.10, 0.20, 0.30, 0.40]
  noise: [0.00, 0.05, 0.10, 0.20, 0.40]
  candidate_k: [4, 8, 16, 32, 64]
  trials_per_cell: 500
sota:
  methods: [DAPD, CoRe, DOS, CLAD, Fast-dLLM++]
  require_official_commit: true
  require_same_checkpoint: true
  require_same_gpu: true
  require_same_dtype: true
  report_equal_nfe: true
  report_equal_wall_clock: true
